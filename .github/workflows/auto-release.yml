name: Automatic Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translatex-auto-release
  cancel-in-progress: false

jobs:
  tag-release:
    name: Tag, build, sign and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          latest="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\\.[0-9]+\\.[0-9]+$' | sort -V | tail -n 1 || true)"

          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next TranslateX release: $next"

      - name: Create and push release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Check repository tags before retrying."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "TranslateX $TAG"
          git push origin "$TAG"

      # Build the release in this same workflow. A tag pushed with GITHUB_TOKEN
      # does not start another workflow, because GitHub suppresses token-triggered runs.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare shared apksign keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_SIGNING_KEYSTORE_BASE64. Run signing sync in khahdihdz/apksign."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_STORE_PASSWORD."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_KEY_PASSWORD."; exit 1; }
          KEY_ALIAS="${KEY_ALIAS:-khahdihdz-release}"
          KEYSTORE_PATH="$RUNNER_TEMP/khahdihdz-release.jks"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslateX-release-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TranslateX ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
