name: Android Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename Debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mv "$APK" "app/build/outputs/apk/debug/translatex-debug.apk"

      # Release signing uses the shared keystore maintained by khahdihdz/apksign.
      # The private key is decoded only on the ephemeral GitHub runner.
      - name: Prepare shared apksign keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_SIGNING_KEYSTORE_BASE64. Run the signing sync workflow in khahdihdz/apksign."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_STORE_PASSWORD."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_KEY_PASSWORD."; exit 1; }
          KEY_ALIAS="${KEY_ALIAS:-khahdihdz-release}"
          KEYSTORE_PATH="$RUNNER_TEMP/khahdihdz-release.jks"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "ANDROID_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          mv "$APK" "app/build/outputs/apk/release/translatex-${TAG}.apk"

      - name: Verify APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/translatex-${{ github.ref_name }}.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload Debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: translatex-debug
          path: app/build/outputs/apk/debug/translatex-debug.apk
          retention-days: 14

      - name: Upload signed Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: translatex-release-signed
          path: app/build/outputs/apk/release/translatex-*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
